<main id="app">

<section class="page-hero">
  <div class="container">
    <div class="eyebrow" data-i18n="consult.eyebrow">Consultation</div>
    <h1 class="display" data-i18n="consult.title"></h1>
    <p class="lead" data-i18n="consult.lead"></p>
  </div>
</section>
<section style="padding-bottom:clamp(56px,8vw,104px)">
  <div class="container consult-single">
    <div class="form-card reveal">
      <form class="form" id="consult-form" novalidate>
        <div class="two"><div class="field"><label for="f-name"><span data-i18n="f.name">Full name</span> <span class="req">*</span></label><input class="input" id="f-name" name="name" required autocomplete="name"><div class="err" data-i18n="f.required"></div></div><div class="field"><label for="f-company"><span data-i18n="f.company">Company</span> <span class="req">*</span></label><input class="input" id="f-company" name="company" required autocomplete="organization"><div class="err" data-i18n="f.required"></div></div></div>
        <div class="two"><div class="field"><label for="f-email"><span data-i18n="f.email">Email</span> <span class="req">*</span></label><input class="input" id="f-email" name="email" required type="email" autocomplete="email"><div class="err" data-i18n="f.required"></div></div><div class="field"><label for="f-phone"><span data-i18n="f.phone">Phone number</span> <span class="req">*</span></label><input class="input" id="f-phone" name="phone" required type="tel" autocomplete="tel"><div class="err" data-i18n="f.required"></div></div></div>
        <div class="field"><label for="f-interest"><span data-i18n="f.interest">Process / product of interest</span> <span class="req">*</span></label><select class="select" id="f-interest" name="interest" required></select><div class="err" data-i18n="f.required"></div></div>
        <div class="field"><label for="f-message"><span data-i18n="f.message">Message</span> <span class="req">*</span></label><textarea class="textarea" id="f-message" name="message" required></textarea><div class="err" data-i18n="f.required"></div></div>
        <button class="btn btn-red btn-lg" type="submit"><span data-i18n="consult.send">Send message</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </form>
    </div>
  </div>
</section>
